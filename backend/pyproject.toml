[project]
name = "ragbot-backend"
version = "0.1.0"
description = "FastAPI backend for RAGBot: ingests a GitHub repository and answers questions about it"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.0.0",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "minsearch>=0.0.5",
    "openai>=1.108.2",
    "pydantic-ai-slim[openai,google]==1.0.9",
    "python-dotenv>=1.0.0",
    "python-frontmatter>=1.1.0",
    "python-multipart>=0.0.9",
    "requests>=2.32.5",
    # Pulls in torch - EMBEDDING_PROVIDER=local is the default, so a plain
    # install must already be able to run it, not just the opt-in providers.
    "sentence-transformers>=5.1.1",
    "sse-starlette>=2.1.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-language-pack>=1.14.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
ragbot = "ragbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ragbot", "ragbot.core", "ragbot.api", "ragbot.api.routes"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # opentelemetry 1.39 deprecates names that pydantic-ai still imports.
    "ignore::DeprecationWarning:opentelemetry.*",
]
