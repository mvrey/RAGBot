[project]
name = "RAGBot"
version = "0.1.0"
description = "An interactive RAG agent that ingests a GitHub repository's code and docs and answers questions about it in natural language"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "minsearch>=0.0.5",
    "openai>=1.108.2",
    "pydantic-ai-slim[openai]==1.0.9",
    "python-dotenv>=1.0.0",
    "python-frontmatter>=1.1.0",
    "requests>=2.32.5",
    "sentence-transformers>=5.1.1",
    "streamlit>=1.61.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-language-pack>=1.14.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit, because flat-layout auto-discovery trips over the sibling
# logs/ and docs/ directories at the repo root.
packages = ["ragbot", "ragbot.src"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # opentelemetry 1.39 deprecates names that pydantic-ai still imports.
    "ignore::DeprecationWarning:opentelemetry.*",
]
